<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popside Admin</title>
    <!-- Sets .dark on <html> before Vue/Pinia even load, so the page never
    paints the wrong theme for a frame and then flips — the theme store
    (stores/theme.js) just reads this same class back on init instead of
    deciding it itself. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('popside.theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
